# deploy/inventory.ini
[somerpg_servers]
# Replace 'your_server_ip_or_hostname' with your actual server's IP address or hostname.
# Replace 'your_ssh_user' with the SSH user you use to connect to the server.
# If your SSH user requires a password for sudo, uncomment and set 'ansible_sudo_pass'.
#
# Example for a server at 192.168.1.10, connecting as 'ubuntu' user:
# 192.168.1.10 ansible_user=ubuntu
#
# Example for a server named 'my-game-server', connecting as 'deploy_user' with sudo password:
# my-game-server ansible_user=deploy_user ansible_sudo_pass=YourSudoPasswordHere

# Uncomment and modify the line below for your server:
# your_server_ip_or_hostname ansible_user=your_ssh_user
#
# Example:
# 192.168.1.10 ansible_user=ubuntu
